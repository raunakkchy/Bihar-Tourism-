<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#190e09"/>
      <stop offset="45%" stop-color="#481f0c"/>
      <stop offset="75%" stop-color="#934617"/>
      <stop offset="100%" stop-color="#d37e28"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e07b1a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#934617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="templeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffce73"/>
      <stop offset="35%" stop-color="#c15a1a"/>
      <stop offset="85%" stop-color="#5a2208"/>
      <stop offset="100%" stop-color="#230a01"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgBg)"/>

  <!-- Halo of Supreme Enlightenment -->
  <circle cx="400" cy="300" r="230" fill="url(#haloGlow)"/>

  <!-- Bodhi Tree Branches Left & Right Framing -->
  <g fill="#210d04" opacity="0.85">
    <path d="M0,0 Q180,60 220,180 Q140,210 110,140 Q60,180 0,220 Z"/>
    <circle cx="160" cy="120" r="60"/>
    <circle cx="230" cy="160" r="45"/>
    <circle cx="90" cy="170" r="50"/>

    <path d="M800,0 Q620,60 580,180 Q660,210 690,140 Q740,180 800,220 Z"/>
    <circle cx="640" cy="120" r="60"/>
    <circle cx="570" cy="160" r="45"/>
    <circle cx="710" cy="170" r="50"/>
  </g>

  <!-- Mahabodhi Temple Main Shikhara -->
  <g transform="translate(400, 360)">
    <!-- Base Terraces -->
    <rect x="-120" y="70" width="240" height="60" fill="url(#templeBody)" rx="3"/>
    <rect x="-135" y="110" width="270" height="20" fill="#2c0e03"/>
    <rect x="-150" y="130" width="300" height="40" fill="#1b0802"/>

    <!-- Central Shikhara -->
    <polygon points="0,-270 -65,70 65,70" fill="url(#templeBody)"/>

    <!-- Horizontal Tier Carvings -->
    <line x1="-15" y1="-210" x2="15" y2="-210" stroke="#ffe399" stroke-width="2.5" opacity="0.8"/>
    <line x1="-26" y1="-160" x2="26" y2="-160" stroke="#ffe399" stroke-width="3" opacity="0.8"/>
    <line x1="-38" y1="-110" x2="38" y2="-110" stroke="#ffe399" stroke-width="3.5" opacity="0.7"/>
    <line x1="-48" y1="-60" x2="48" y2="-60" stroke="#ffe399" stroke-width="4" opacity="0.7"/>
    <line x1="-56" y1="-10" x2="56" y2="-10" stroke="#ffe399" stroke-width="4" opacity="0.6"/>
    <line x1="-62" y1="35" x2="62" y2="35" stroke="#ffe399" stroke-width="4.5" opacity="0.6"/>

    <!-- Gold Kalasha Finial -->
    <circle cx="0" cy="-280" r="9" fill="#ffdf80"/>
    <polygon points="0,-315 -4,-280 4,-280" fill="#ffeeb2"/>
    <circle cx="0" cy="-318" r="4" fill="#ffffff"/>

    <!-- 4 Subsidiary Corner Shikharas -->
    <polygon points="-80,0 -96,70 -64,70" fill="url(#templeBody)"/>
    <polygon points="-80,-20 -82,0 -78,0" fill="#ffe399"/>
    <polygon points="80,0 64,70 96,70" fill="url(#templeBody)"/>
    <polygon points="80,-20 78,0 82,0" fill="#ffe399"/>

    <!-- Golden Buddha Sanctum Niche -->
    <rect x="-24" y="75" width="48" height="50" rx="12" fill="#120401"/>
    <circle cx="0" cy="92" r="8" fill="#ffd166"/>
    <path d="M-13,118 Q0,102 13,118 Z" fill="#ffd166"/>
  </g>

  <!-- Meditating Monks in Foreground -->
  <g transform="translate(400, 520)">
    <g transform="translate(-160, 20)">
      <circle cx="0" cy="-14" r="8" fill="#a4460b"/>
      <path d="M-18,14 Q0,-6 18,14 Z" fill="#b95311"/>
    </g>
    <g transform="translate(160, 20)">
      <circle cx="0" cy="-14" r="8" fill="#a4460b"/>
      <path d="M-18,14 Q0,-6 18,14 Z" fill="#b95311"/>
    </g>
    <g transform="translate(0, 30)">
      <circle cx="0" cy="-16" r="10" fill="#c45d16"/>
      <path d="M-22,18 Q0,-7 22,18 Z" fill="#e0711e"/>
    </g>
  </g>

  <!-- Golden Lotus Border Motif -->
  <path d="M370,575 Q400,560 430,575 Q415,595 385,595 Z" fill="#ffe699" opacity="0.6"/>
</svg>
