<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyNalanda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#231713"/>
      <stop offset="50%" stop-color="#5c2612"/>
      <stop offset="85%" stop-color="#aa481a"/>
      <stop offset="100%" stop-color="#ea8738"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e26c2e"/>
      <stop offset="40%" stop-color="#ab4215"/>
      <stop offset="80%" stop-color="#6e2508"/>
      <stop offset="100%" stop-color="#360f02"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a451e"/>
      <stop offset="100%" stop-color="#12230b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyNalanda)"/>

  <!-- Sun setting behind Nalanda -->
  <circle cx="400" cy="280" r="90" fill="#fed480" opacity="0.85"/>
  <circle cx="400" cy="280" r="180" fill="#ea8738" opacity="0.25"/>

  <!-- Manicured Green Grounds -->
  <rect y="440" width="800" height="160" fill="url(#grassGrad)"/>

  <!-- Famous Temple No. 3 (Votive Stupa Terraces) -->
  <g transform="translate(400, 360)">
    <!-- Base Platform -->
    <polygon points="-280,120 280,120 250,80 -250,80" fill="url(#brickGrad)"/>
    <rect x="-260" y="110" width="520" height="10" fill="#2d0d02"/>
    
    <!-- Tier 2 -->
    <polygon points="-230,80 230,80 200,40 -200,40" fill="url(#brickGrad)"/>
    
    <!-- Tier 3 -->
    <polygon points="-180,40 180,40 150,0 -150,0" fill="url(#brickGrad)"/>

    <!-- Central Grand Votive Stupa Tower -->
    <polygon points="-80,0 80,0 50,-150 -50,-150" fill="url(#brickGrad)"/>
    
    <!-- Stupa Niche Arches (Carved Brickwork) -->
    <path d="M-30,-120 A30,30 0 0,1 30,-120 L30,-60 L-30,-60 Z" fill="#210801"/>
    <circle cx="0" cy="-90" r="12" fill="#fed480" opacity="0.8"/>

    <!-- Flanking Corner Stupas -->
    <polygon points="-140,0 -100,0 -110,-90 -130,-90" fill="url(#brickGrad)"/>
    <circle cx="-120" cy="-95" r="8" fill="#e26c2e"/>

    <polygon points="100,0 140,0 130,-90 110,-90" fill="url(#brickGrad)"/>
    <circle cx="120" cy="-95" r="8" fill="#e26c2e"/>

    <!-- Classical Nalanda Multi-tiered Brick Lines -->
    <line x1="-190" y1="60" x2="190" y2="60" stroke="#f69958" stroke-width="2" opacity="0.4"/>
    <line x1="-140" y1="20" x2="140" y2="20" stroke="#f69958" stroke-width="2" opacity="0.4"/>
    <line x1="-60" y1="-40" x2="60" y2="-40" stroke="#f69958" stroke-width="2" opacity="0.4"/>
    <line x1="-54" y1="-80" x2="54" y2="-80" stroke="#f69958" stroke-width="2" opacity="0.4"/>

    <!-- Excavated Monastic Cells & Portico Pillars Left & Right -->
    <g fill="#431405" opacity="0.9">
      <rect x="-340" y="80" width="30" height="45"/>
      <rect x="-300" y="80" width="15" height="45"/>
      <rect x="310" y="80" width="30" height="45"/>
      <rect x="285" y="80" width="15" height="45"/>
    </g>
  </g>

  <!-- Ancient Scholar / Traveler Silhouette (Xuanzang Tribute) -->
  <g transform="translate(180, 480)" fill="#1c0902">
    <!-- Walking staff with scroll pack -->
    <circle cx="0" cy="-35" r="7"/>
    <path d="M-10,-5 Q0,-25 10,-5 L8,25 L-8,25 Z"/>
    <rect x="-18" y="-30" width="10" height="24" rx="2" fill="#5c2612"/>
    <line x1="16" y1="-35" x2="16" y2="30" stroke="#1c0902" stroke-width="3"/>
  </g>
</svg>
