<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sunMithila" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Parchment Handmade Paper Canvas -->
  <rect width="800" height="600" fill="#fcf6ea"/>

  <!-- Outer Traditional Double Border with Chevron/Hatching -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#8b3a0f" stroke-width="4"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#1c2127" stroke-width="2"/>
  
  <!-- Border Flower Florets -->
  <circle cx="36" cy="36" r="6" fill="#8b3a0f"/>
  <circle cx="764" cy="36" r="6" fill="#8b3a0f"/>
  <circle cx="36" cy="564" r="6" fill="#8b3a0f"/>
  <circle cx="764" cy="564" r="6" fill="#8b3a0f"/>

  <!-- Iconic Mithila Radiant Sun (Surya) Center -->
  <g transform="translate(400, 240)">
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="95" fill="url(#sunMithila)" stroke="#1c2127" stroke-width="3"/>
    
    <!-- Concentric Decorative Circles & Dots -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#8b3a0f" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1c2127" stroke-width="2"/>
    
    <!-- Sacred Face of Surya (Traditional Eyes) -->
    <!-- Left Eye -->
    <path d="M-35,-12 Q-20,-30 0,-12 Q-20,0 -35,-12 Z" fill="#ffffff" stroke="#1c2127" stroke-width="2"/>
    <circle cx="-18" cy="-14" r="5" fill="#1c2127"/>
    <!-- Right Eye -->
    <path d="M0,-12 Q20,-30 35,-12 Q20,0 0,-12 Z" fill="#ffffff" stroke="#1c2127" stroke-width="2"/>
    <circle cx="18" cy="-14" r="5" fill="#1c2127"/>
    <!-- Tilak & Nose -->
    <path d="M0,-35 L0,15" stroke="#8b3a0f" stroke-width="3"/>
    <circle cx="0" cy="-42" r="5" fill="#dc2626"/>
    <!-- Smile -->
    <path d="M-18,28 Q0,42 18,28" stroke="#1c2127" stroke-width="2.5" fill="none"/>

    <!-- Radiant Flaming Sun Rays (32 Rays) -->
    <!-- Cardinal & Diagonal Large Rays -->
    <polygon points="0,-98 12,-140 -12,-140" fill="#dc2626"/>
    <polygon points="0,98 12,140 -12,140" fill="#dc2626"/>
    <polygon points="-98,0 -140,-12 -140,12" fill="#dc2626"/>
    <polygon points="98,0 140,-12 140,12" fill="#dc2626"/>

    <polygon points="-70,-70 -105,-105 -90,-115" fill="#f59e0b"/>
    <polygon points="70,-70 105,-105 90,-115" fill="#f59e0b"/>
    <polygon points="-70,70 -105,105 -90,115" fill="#f59e0b"/>
    <polygon points="70,70 105,105 90,115" fill="#f59e0b"/>
  </g>

  <!-- Sacred Mithila Twin Peacocks (Mayur) with fine line cross-hatching -->
  <!-- Left Peacock -->
  <g transform="translate(200, 440)">
    <!-- Peacock Body -->
    <path d="M0,0 C-30,-20 -50,-60 -20,-80 C10,-100 40,-60 20,-20 C30,30 -10,40 0,0 Z" fill="#0284c7" stroke="#1c2127" stroke-width="2"/>
    <!-- Head & Crest -->
    <circle cx="-18" cy="-85" r="9" fill="#0284c7" stroke="#1c2127" stroke-width="2"/>
    <line x1="-18" y1="-94" x2="-26" y2="-112" stroke="#1c2127" stroke-width="2"/>
    <circle cx="-26" cy="-114" r="3" fill="#dc2626"/>
    <line x1="-15" y1="-94" x2="-15" y2="-114" stroke="#1c2127" stroke-width="2"/>
    <circle cx="-15" cy="-116" r="3" fill="#dc2626"/>
    <!-- Eye & Beak -->
    <circle cx="-21" cy="-86" r="2" fill="#ffffff"/>
    <polygon points="-27,-84 -38,-82 -27,-80" fill="#f59e0b"/>
    <!-- Elaborate Tail Feathers Fan -->
    <path d="M20,-20 Q90,-40 100,50 Q40,60 0,0 Z" fill="#15803d" stroke="#1c2127" stroke-width="2"/>
    <circle cx="50" cy="10" r="10" fill="#f59e0b" stroke="#1c2127" stroke-width="1.5"/>
    <circle cx="50" cy="10" r="5" fill="#0284c7"/>
    <circle cx="75" cy="30" r="9" fill="#f59e0b" stroke="#1c2127" stroke-width="1.5"/>
    <circle cx="75" cy="30" r="4.5" fill="#0284c7"/>
  </g>

  <!-- Right Peacock -->
  <g transform="translate(600, 440) scale(-1, 1)">
    <!-- Peacock Body -->
    <path d="M0,0 C-30,-20 -50,-60 -20,-80 C10,-100 40,-60 20,-20 C30,30 -10,40 0,0 Z" fill="#0284c7" stroke="#1c2127" stroke-width="2"/>
    <circle cx="-18" cy="-85" r="9" fill="#0284c7" stroke="#1c2127" stroke-width="2"/>
    <line x1="-18" y1="-94" x2="-26" y2="-112" stroke="#1c2127" stroke-width="2"/>
    <circle cx="-26" cy="-114" r="3" fill="#dc2626"/>
    <circle cx="-21" cy="-86" r="2" fill="#ffffff"/>
    <polygon points="-27,-84 -38,-82 -27,-80" fill="#f59e0b"/>
    <path d="M20,-20 Q90,-40 100,50 Q40,60 0,0 Z" fill="#15803d" stroke="#1c2127" stroke-width="2"/>
    <circle cx="50" cy="10" r="10" fill="#f59e0b" stroke="#1c2127" stroke-width="1.5"/>
    <circle cx="50" cy="10" r="5" fill="#0284c7"/>
  </g>

  <!-- Traditional Lotus Flowers Center Bottom -->
  <g transform="translate(400, 490)">
    <path d="M0,10 C-30,-20 -40,-60 0,-70 C40,-60 30,-20 0,10 Z" fill="#f43f5e" stroke="#1c2127" stroke-width="2"/>
    <path d="M-15,10 C-45,-10 -60,-40 -35,-55 C-20,-45 -15,-10 -15,10 Z" fill="#fb7185" stroke="#1c2127" stroke-width="1.5"/>
    <path d="M15,10 C45,-10 60,-40 35,-55 C20,-45 15,-10 15,10 Z" fill="#fb7185" stroke="#1c2127" stroke-width="1.5"/>
    <circle cx="0" cy="-35" r="6" fill="#fef08a"/>
  </g>
</svg>
