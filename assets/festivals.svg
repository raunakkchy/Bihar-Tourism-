<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyChhath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b0e07"/>
      <stop offset="35%" stop-color="#4d1a07"/>
      <stop offset="70%" stop-color="#aa3b09"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gangaSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="40%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="sunDawn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyChhath)"/>

  <!-- Golden Sunrise Sun of Surya Devata Rising -->
  <circle cx="400" cy="240" r="85" fill="url(#sunDawn)"/>
  <circle cx="400" cy="240" r="180" fill="#f59e0b" opacity="0.3"/>

  <!-- Sacred Ganges River at Dawn -->
  <rect y="380" width="800" height="220" fill="url(#gangaSun)"/>

  <!-- Glimmering Sun Trail on the River -->
  <ellipse cx="400" cy="410" rx="160" ry="12" fill="#fde047" opacity="0.6"/>
  <ellipse cx="400" cy="445" rx="220" ry="16" fill="#f59e0b" opacity="0.5"/>
  <ellipse cx="400" cy="490" rx="280" ry="22" fill="#ea580c" opacity="0.35"/>
  <ellipse cx="400" cy="545" rx="360" ry="28" fill="#c2410c" opacity="0.25"/>

  <!-- Sugarcane Stalks Framing (Ikh) -->
  <g stroke="#15803d" stroke-width="7" fill="none">
    <path d="M120,600 Q140,250 80,40"/>
    <path d="M160,600 Q170,280 140,60"/>
    <path d="M680,600 Q660,250 720,40"/>
    <path d="M640,600 Q630,280 660,60"/>
  </g>
  <!-- Sugarcane leaves -->
  <path d="M90,120 Q50,150 20,200" stroke="#22c55e" stroke-width="3" fill="none"/>
  <path d="M140,160 Q100,200 60,260" stroke="#22c55e" stroke-width="3" fill="none"/>
  <path d="M710,120 Q750,150 780,200" stroke="#22c55e" stroke-width="3" fill="none"/>
  <path d="M660,160 Q700,200 740,260" stroke="#22c55e" stroke-width="3" fill="none"/>

  <!-- Devotee in Holy River offering Surya Arghya with Bamboo Soop & Diya -->
  <g transform="translate(400, 410)">
    <!-- River rippling around devotee -->
    <ellipse cx="0" cy="70" rx="60" ry="10" fill="#fde047" opacity="0.5"/>

    <!-- Devotee Silhouette (Red/Saffron Chhath Saree) -->
    <path d="M-28,75 Q-20,0 0,-15 Q20,0 28,75 Z" fill="#991b1b"/>
    <circle cx="0" cy="-30" r="13" fill="#78350f"/>
    <!-- Sacred red sindoor line -->
    <line x1="0" y1="-42" x2="0" y2="40" stroke="#ef4444" stroke-width="3"/>

    <!-- Arms lifted with Bamboo Soop offering to the Sun -->
    <!-- Bamboo Soop (Tray) -->
    <g transform="translate(0, -60)">
      <polygon points="-45,0 45,0 35,22 -35,22" fill="#d97706" stroke="#92400e" stroke-width="2"/>
      <!-- Holy Thekua & Fresh Fruits on Soop -->
      <circle cx="-20" cy="8" r="6" fill="#78350f"/>
      <circle cx="-8" cy="6" r="5" fill="#f59e0b"/>
      <circle cx="10" cy="7" r="7" fill="#dc2626"/>
      <circle cx="22" cy="8" r="5" fill="#eab308"/>
      <!-- Sacred Earthen Diya with Glowing Flame -->
      <ellipse cx="0" cy="5" rx="7" ry="4" fill="#b45309"/>
      <circle cx="0" cy="-2" r="5" fill="#fef08a"/>
      <polygon points="0,-12 -3,-3 3,-3" fill="#ea580c"/>
    </g>

    <line x1="-20" y1="0" x2="-25" y2="-45" stroke="#78350f" stroke-width="5"/>
    <line x1="20" y1="0" x2="25" y2="-45" stroke="#78350f" stroke-width="5"/>
  </g>

  <!-- Small floating diyas on the river -->
  <g transform="translate(240, 480)">
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="0" cy="-2" r="3" fill="#fffbeb"/>
  </g>
  <g transform="translate(560, 510)">
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/>
    <circle cx="0" cy="-2" r="2.5" fill="#fffbeb"/>
  </g>
</svg>
