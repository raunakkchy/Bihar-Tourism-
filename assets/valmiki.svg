<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyValmiki" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e231a"/>
      <stop offset="50%" stop-color="#1b4431"/>
      <stop offset="85%" stop-color="#3c7352"/>
      <stop offset="100%" stop-color="#8bb789"/>
    </linearGradient>
    <linearGradient id="forestDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#194028"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <linearGradient id="riverGandak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a6a"/>
      <stop offset="100%" stop-color="#102b2c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyValmiki)"/>

  <!-- Distant Snow-touched Himalayan Foothills -->
  <polygon points="0,280 180,180 340,260 520,150 680,240 800,190 800,380 0,380" fill="#2d523e" opacity="0.5"/>
  <polygon points="460,180 520,150 580,180" fill="#eaf4ea" opacity="0.6"/>

  <!-- Dense Sal Forest Canopies Layer 1 -->
  <path d="M0,340 Q150,260 300,320 T600,290 T800,330 L800,480 L0,480 Z" fill="#1b4431"/>

  <!-- Gandak River winding through Terai -->
  <path d="M120,440 Q300,420 480,480 Q620,530 800,500 L800,600 L0,600 L0,500 Z" fill="url(#riverGandak)"/>
  <path d="M220,460 Q380,450 560,510" stroke="#8bb789" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Dense Foreground Forest Trees -->
  <g fill="url(#forestDeep)">
    <!-- Tree Left -->
    <path d="M-40,600 L40,600 L10,320 L-20,320 Z"/>
    <circle cx="20" cy="280" r="90"/>
    <circle cx="80" cy="220" r="80"/>
    <circle cx="-10" cy="180" r="75"/>

    <!-- Tree Right -->
    <path d="M740,600 L820,600 L790,300 L760,300 Z"/>
    <circle cx="760" cy="260" r="100"/>
    <circle cx="700" cy="190" r="80"/>
    <circle cx="810" cy="170" r="85"/>
  </g>

  <!-- Royal Bengal Tiger Silhouette along riverbank -->
  <g transform="translate(380, 480)" fill="#0d1f14">
    <!-- Body -->
    <path d="M-50,0 C-40,-25 20,-28 50,0 C30,12 -30,12 -50,0 Z"/>
    <!-- Head & Ears -->
    <circle cx="60" cy="-6" r="15"/>
    <polygon points="56,-22 62,-18 53,-15"/>
    <polygon points="66,-22 72,-18 64,-15"/>
    <!-- Snout -->
    <path d="M68,-10 L78,-4 L68,2 Z"/>
    <!-- Tail curving upwards -->
    <path d="M-48,-4 C-70,-15 -75,-35 -65,-40 C-60,-40 -64,-20 -44,-2" stroke="#0d1f14" stroke-width="7" fill="none"/>
    <!-- Legs -->
    <rect x="-40" y="4" width="9" height="30" rx="3"/>
    <rect x="-24" y="4" width="8" height="26" rx="3"/>
    <rect x="22" y="4" width="9" height="28" rx="3"/>
    <rect x="38" y="4" width="9" height="30" rx="3"/>
    <!-- Tiger golden eye gleam -->
    <circle cx="67" cy="-7" r="2" fill="#fcd34d"/>
  </g>

  <!-- Wildlife Birds in Flight -->
  <path d="M260,180 Q270,170 280,180 Q290,170 300,180" stroke="#0e231a" stroke-width="2.5" fill="none"/>
  <path d="M310,160 Q318,152 326,160 Q334,152 342,160" stroke="#0e231a" stroke-width="2" fill="none"/>
</svg>
